; Control difuso de velocidad de un motor a pasos (Control Avanzado, Unidad 3)
;
; Un solo programa (src/main.cpp) que usa los módulos de lib/ (config, difuso, encoder, motor).

[platformio]
default_envs = motor_difuso

[env:motor_difuso]
; espressif32 6.x trae Arduino-ESP32 2.0.x (igual que el proyecto del péndulo)
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Subida a 115200 (más lenta pero confiable): a 921600 llegó dañada ("MD5 of file does not match data in flash").
upload_speed = 115200
; send_on_enter: los comandos se mandan al presionar Enter. monitor_echo: ver lo que escribes.
; log2file: todo lo que llega por el monitor se guarda en la carpeta logs/ (para MATLAB).
monitor_filters = esp32_exception_decoder, send_on_enter, log2file
monitor_echo = yes
lib_deps =
    madhephaestus/ESP32Encoder@^0.11.7
    gin66/FastAccelStepper@^0.31.3
